name: Aggiorna Dati Borsa

on:
  schedule:
    - cron: '00 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-mercati:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le librerie necessarie
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas lxml html5lib

      - name: Esegui lo script di analisi borsa
        run: python aggiorna_borsa.py

      - name: Commit e push dei file aggiornati su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add dati_*.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico dati di borsa [skip ci]"
          git push
